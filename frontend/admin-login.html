<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login — EventBook</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">🔐 Admin Panel</div>
      <h1 class="auth-title">Staff Access</h1>
      <p class="auth-sub">Restricted to EventBook administrators</p>
      <div id="alert" class="alert"></div>
      <form id="adminLoginForm" novalidate>
        <div class="form-group">
          <label class="form-label">Admin Email</label>
          <input class="input" type="email" id="email" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="input" type="password" id="password" required>
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary btn-full btn-lg">Login as Admin →</button>
      </form>
      <div class="auth-divider"><a href="login.html">← Back to user login</a></div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin-login.js"></script>
</body>
</html>
