<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password — EventBook</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">🎫 EventBook</div>
      <h1 class="auth-title">🔄 Reset Password</h1>
      <p class="auth-sub">Enter OTP and choose a new password</p>
      <div id="alert" class="alert"></div>
      <form id="resetForm" novalidate>
        <div class="form-group">
          <label class="form-label">6-digit OTP</label>
          <input class="input otp-input" type="text" id="otp" maxlength="6" placeholder="______" required>
        </div>
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input class="input" type="password" id="password" minlength="6" placeholder="Min 6 characters" required>
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary btn-full btn-lg">Reset Password →</button>
      </form>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/reset.js"></script>
</body>
</html>
