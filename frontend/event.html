<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Details — EventBook</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="brand"><span>🎫</span><span class="brand-mark">EventBook</span></a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html" id="navDash" class="hidden">My Bookings</a>
        <a href="login.html" id="navLogin">Login</a>
        <button id="navLogout" onclick="logout()" class="btn-ghost hidden">Logout</button>
        <div id="navUser" class="avatar hidden"></div>
      </div>
    </div>
  </nav>

  <main class="container" style="padding-top:calc(var(--nav-h) + 32px);padding-bottom:60px;max-width:1000px;">
    <div id="skeleton" class="skeleton" style="height:400px;border-radius:24px;"></div>
    <div id="content" class="hidden"></div>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> EventBook</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/event.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    renderNavbar('event.html');
  </script>
</body>
</html>
