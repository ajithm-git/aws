<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings — EventBook</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="brand"><span>🎫</span><span class="brand-mark">EventBook</span></a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html">My Bookings</a>
        <button onclick="logout()" class="btn-ghost">Logout</button>
        <div id="navUser" class="avatar"></div>
      </div>
    </div>
  </nav>

  <main class="container" style="padding-top:calc(var(--nav-h) + 32px);padding-bottom:60px;">
    <h1 style="margin-bottom:6px;">My Bookings 🎟️</h1>
    <p class="text-muted" style="margin-bottom:24px;">All your confirmed & past events</p>

    <div id="stats" class="grid grid-4" style="margin-bottom:28px;"></div>

    <div class="chips" style="margin-bottom:22px;">
      <button class="chip active" data-tab="upcoming" onclick="switchTab('upcoming')">Upcoming</button>
      <button class="chip" data-tab="past" onclick="switchTab('past')">Past</button>
      <button class="chip" data-tab="cancelled" onclick="switchTab('cancelled')">Cancelled</button>
    </div>

    <div id="list" class="grid grid-2"></div>

    <div id="empty" class="empty-state hidden">
      <div class="empty-state-icon">🎟️</div>
      <h3>No bookings here</h3>
      <p><a href="index.html" style="color:var(--violet-400);">Browse events →</a></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
  <script>
    renderNavbar('dashboard.html');
    const u = currentUser();
    if (u) document.getElementById('navUser').textContent = u.initials || u.name?.slice(0, 2).toUpperCase();
  </script>
</body>
</html>
